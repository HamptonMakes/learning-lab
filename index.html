<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Hampton's CS Concept Lab</title>
    <!-- description + canonical are route-managed (src/app/seo.ts via <HeadContent/>); only the
         OG/twitter fallbacks live here, for link unfurlers that never execute JavaScript. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hampton's CS Concept Lab" />
    <meta property="og:title" content="Hampton's CS Concept Lab" />
    <meta
      property="og:description"
      content="Press play on computer science: animated lessons on CRDTs and friends, computed by real code."
    />
    <meta property="og:image" content="https://learn.hamptonmakes.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Mirrors src/settings/theme.ts.
      try {
        var s = JSON.parse(localStorage.getItem('cs-lab:settings') || '{}')
        var t = s.theme || 'system'
        var dark =
          t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
