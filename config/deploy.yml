# Kamal 2 deployment for Hampton's CS Concept Lab (static SPA served by Caddy).
# Fill in the placeholders (servers, registry) and run: kamal setup / kamal deploy
service: cs-lab
image: hamptonmakes/cs-lab

servers:
  web:
    - 203.0.113.10 # <- replace with your host

proxy:
  ssl: true
  host: lab.hamptonmakes.com # <- replace if you mount it elsewhere
  app_port: 80
  healthcheck:
    path: /up
    interval: 3
    timeout: 5

registry:
  server: ghcr.io
  username: hamptonmakes
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  args:
    # Vite env is baked at build time; these values are public.
    VITE_UMAMI_SCRIPT_URL: <%= ENV.fetch("VITE_UMAMI_SCRIPT_URL", "") %>
    VITE_UMAMI_WEBSITE_ID: <%= ENV.fetch("VITE_UMAMI_WEBSITE_ID", "") %>
    BASE_PATH: "/"

# The app is stateless; Postgres is available in prod but unused in v1.
