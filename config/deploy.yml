# Kamal 2 deployment for Hampton's CS Concept Lab — a static SPA served by Caddy.
# Secrets are never stored in this repo: see .kamal/secrets (Proton Pass CLI).
service: cs-lab
image: hamptonlc/cs-lab

registry:
  username: hamptonlc
  password:
    - KAMAL_REGISTRY_PASSWORD

servers:
  web:
    hosts:
      - 178.156.220.157

ssh:
  user: hampton

builder:
  # Build on the server (same as umami-deploy) — native amd64, no emulation on the Mac.
  remote: ssh://hampton@178.156.220.157
  arch: amd64
  args:
    # Vite bakes these into the bundle at build time. They are public values, not secrets.
    VITE_UMAMI_SCRIPT_URL: https://analytics.lin.cat/script.js
    VITE_UMAMI_WEBSITE_ID: 14a6bc82-38e2-49ae-8aef-f9a3713e8fcc
    VITE_UMAMI_RECORDER_URL: https://analytics.lin.cat/recorder.js
    BASE_PATH: '/'

proxy:
  ssl: true
  hosts:
    - learn.hamptonmakes.com
  app_port: 80
  healthcheck:
    path: /up
    interval: 3
    timeout: 5

aliases:
  shell: app exec --interactive --reuse "sh"
  logs: app logs -f

# The app is stateless; Postgres is available on the host but unused in v1.
